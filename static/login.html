<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso | Análisis de Plantas FV</title><link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">OPERACIÓN FOTOVOLTAICA</p>
    <h1>Análisis de Plantas FV</h1>
    <p class="intro">Acceso privado para seguimiento de plantas.</p>
    <form id="login-form">
      <label>Usuario<input id="username" name="username" autocomplete="username" required></label>
      <label>Contraseña<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" role="alert" hidden></p>
      <button type="submit">Iniciar sesión</button>
    </form>
    <p class="notice">No compartas claves de plataformas fotovoltaicas en esta página.</p>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
